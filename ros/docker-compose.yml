services:
  unizar_drones_ros:
    image: unizar_drones_ros
    build:
      context: ./docker/
      dockerfile: Dockerfile
    container_name: unizar_drones_ros
    environment:
      DISPLAY: $DISPLAY
      ROS_LOCALHOST_ONLY: 1
      # Real drone
      # ROS_MASTER_URI: http://192.168.0.101:11311
      # ROS_IP: 192.168.0.150
      # Simulation
      ROS_MASTER_URI: http://localhost:11311
      ROS_HOSTNAME: localhost
      ROS_IP: localhost
    privileged: true
    volumes:
      # X11
      - ~/.Xauthority:/root/.Xauthority
      # 
      - /dev/:/dev
      # Code
      - ./catkin_ws:/root/catkin_ws
    network_mode: "host"
    command: tail -f /dev/null
